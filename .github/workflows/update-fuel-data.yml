name: Update Fuel Data and Deploy Pages

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run Fuel Finder Diagnostics (User-Agent vs CIDR)
        env:
          RUN_LIVE_FUEL_FINDER_TEST: "1"
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}
          FUEL_FINDER_TOKEN_URL: ${{ secrets.FUEL_FINDER_TOKEN_URL || vars.FUEL_FINDER_TOKEN_URL }}
        run: |
          go test -v -run TestFuelFinderBlockDiagnosis ./internal/client || true

      - name: Run Fuel Ingestion Pipeline
        env:
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}
          FUEL_FINDER_TOKEN_URL: ${{ secrets.FUEL_FINDER_TOKEN_URL || vars.FUEL_FINDER_TOKEN_URL }}
          FUEL_FINDER_BASE_URL: ${{ secrets.FUEL_FINDER_BASE_URL || vars.FUEL_FINDER_BASE_URL }}
          FUEL_FINDER_STATIONS_ENDPOINT: ${{ secrets.FUEL_FINDER_STATIONS_ENDPOINT || vars.FUEL_FINDER_STATIONS_ENDPOINT }}
          FUEL_FINDER_SCOPE: ${{ secrets.FUEL_FINDER_SCOPE || vars.FUEL_FINDER_SCOPE }}
        run: |
          go run ./cmd/pipeline/main.go

      - name: Stage Site Files
        run: |
          mkdir -p _site/data/outcodes
          cp -r static/* _site/
          cp -r data/outcodes/*.json _site/data/outcodes/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
